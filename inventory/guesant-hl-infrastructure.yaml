repository: guesant/hl-infrastructure
ref: main

sources:
  - README.md
  - justfile
  - .config/
  - .github/workflows/
  - .github/actions/
  - .tools/docker/Dockerfile
  - .tools/
  - ansible/roles/
  - ansible/group_vars/
  - argocd/
  - tofu/
  - docs/requirements.in

tooling:
  orchestration:
    - just
    - github-actions
    - github-cli

  containers:
    - docker
    - docker-buildx
    - containerd

  infrastructure-as-code:
    - ansible
    - ansible-lint
    - helm
    - opentofu
    - kubectl
    - k3s
    - conftest

  opentofu-providers:
    - terraform-provider-cloudflare
    - terraform-provider-keycloak
    - terraform-provider-tailscale

  host-configuration:
    - apparmor
    - auditd
    - dnsmasq
    - fail2ban
    - firewalld
    - journald
    - openssh
    - smartmontools
    - sysctl
    - systemd
    - tailscale
    - unattended-upgrades

  host-supporting-dependencies:
    - ipset
    - rfkill
    - rpcbind

  kubernetes-platform:
    - kubernetes
    - argocd
    - cilium
    - cilium-cli
    - hubble
    - helm
    - kargo
    - cert-manager
    - cloudnative-pg
    - postgresql
    - sops-secrets-operator
    - kube-bench
    - traefik
    - oauth2-proxy
    - portainer
    - reloader
    - kube-prometheus-stack
    - prometheus
    - prometheus-operator
    - alertmanager
    - grafana
    - kube-state-metrics
    - prometheus-node-exporter
    - prometheus-blackbox-exporter
    - local-path-provisioner
    - cloudflared
    - dashy
    - keycloak
    - stakater-application

  code-quality:
    - actionlint
    - ast-grep
    - commitlint
    - jscpd
    - markdownlint-cli2
    - shellcheck
    - hadolint
    - yamllint

  documentation:
    - mkdocs
    - mkdocs-material
    - pymdown-extensions
    - mermaid
    - vale
    - languagetool
    - cspell
    - lychee

  security:
    - zizmor
    - gitleaks
    - osv-scanner
    - trivy
    - checkov
    - kubescape
    - kube-linter
    - kubeconform
    - openssf-scorecard
    - kube-bench

  secrets:
    - sops
    - age
    - age-plugin-se
    - sops-secrets-operator
    - openssl

  runtime-utilities:
    - bash
    - python
    - curl
    - jq
    - yq
    - git

  dependency-management:
    - renovate

  external-platforms:
    - github
    - cloudflare

github-actions-dependencies:
  - actions/cache
  - actions/checkout
  - actions/configure-pages
  - actions/deploy-pages
  - actions/setup-python
  - actions/upload-artifact
  - actions/upload-pages-artifact
  - docker/setup-buildx-action
  - dorny/paths-filter
  - github/codeql-action/upload-sarif
  - ossf/scorecard-action
  - renovatebot/github-action
  - zizmorcore/zizmor-action

not-promoted-to-tool-placeholder:
  generic-shell-utilities:
    - coreutils
    - grep
    - sed
    - awk
    - find
    - cut
    - head
    - tail
    - tr
    - base64
    - sha256sum
    - wc
  managed-but-not-used-as-tooling:
    - rpcbind

notes:
  - Tool directories remain placeholders during the inventory phase.
  - The inventory includes CI executables, tools configured by Ansible, components managed by Argo CD, providers consumed by OpenTofu, and documentation build tooling.
  - A component may appear in more than one category because categories describe capabilities and roles rather than ownership.
  - Supporting packages and generic shell utilities are mapped here but are not automatically promoted to tools/ unless they gain reusable configuration of their own.
  - GitHub marketplace actions are mapped as dependencies of github-actions instead of receiving individual tool directories.
  - openssh is the canonical tool name for sshd configuration.
  - sysctl and journald are retained as configuration targets even though they are operating-system subsystems rather than standalone projects.
  - Aggregate charts and directly configured components may both appear when the repository owns configuration for each level.
  - References that exist only in learning documentation are not inventory entries unless they are also used or configured by the repository.
