repository: guesant/hl-infrastructure
ref: main

sources:
  - justfile
  - .config/
  - .github/workflows/
  - .github/actions/
  - .tools/docker/Dockerfile
  - .tools/
  - ansible/roles/
  - ansible/group_vars/
  - argocd/
  - tofu/

tooling:
  orchestration:
    - just
    - github-actions
    - github-cli

  containers:
    - docker
    - docker-buildx

  infrastructure-as-code:
    - ansible
    - ansible-lint
    - helm
    - opentofu
    - kubectl
    - k3s
    - conftest

  opentofu-providers:
    - terraform-provider-cloudflare
    - terraform-provider-keycloak
    - terraform-provider-tailscale

  host-configuration:
    - apparmor
    - auditd
    - fail2ban
    - firewalld
    - journald
    - openssh
    - smartmontools
    - sysctl
    - systemd
    - tailscale
    - unattended-upgrades

  kubernetes-platform:
    - kubernetes
    - argocd
    - cilium
    - cilium-cli
    - helm
    - kargo
    - cert-manager
    - cloudnative-pg
    - sops-secrets-operator
    - kube-bench
    - traefik
    - oauth2-proxy
    - portainer
    - reloader
    - kube-prometheus-stack
    - prometheus
    - prometheus-operator
    - alertmanager
    - grafana
    - kube-state-metrics
    - prometheus-node-exporter
    - prometheus-blackbox-exporter
    - local-path-provisioner
    - cloudflared
    - dashy
    - keycloak
    - stakater-application

  code-quality:
    - actionlint
    - ast-grep
    - commitlint
    - jscpd
    - markdownlint-cli2
    - shellcheck
    - hadolint
    - yamllint

  documentation:
    - mkdocs
    - vale
    - languagetool
    - cspell
    - lychee

  security:
    - zizmor
    - gitleaks
    - osv-scanner
    - trivy
    - checkov
    - kubescape
    - kube-linter
    - kubeconform
    - openssf-scorecard
    - kube-bench

  secrets:
    - sops
    - age
    - age-plugin-se
    - sops-secrets-operator

  dependency-management:
    - renovate

notes:
  - Tool directories remain placeholders during the inventory phase.
  - The inventory includes tools configured by Ansible, components managed by Argo CD, and providers consumed by OpenTofu, not only CI executables.
  - A component may appear in more than one category because categories describe capabilities and roles rather than ownership.
  - Unix utilities used only as implementation details, such as grep, curl, jq, base64, and coreutils, are not promoted as catalog tools yet.
  - GitHub marketplace actions used only as workflow building blocks remain represented by github-actions instead of receiving individual tool entries.
  - openssh is the canonical tool name for sshd configuration.
  - sysctl and journald are retained as configuration targets even though they are operating-system subsystems rather than standalone projects.
  - Aggregate charts and their directly configured components may both appear when the repository owns configuration for each level.
